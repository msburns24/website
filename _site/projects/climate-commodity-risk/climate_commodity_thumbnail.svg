<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500"
     viewBox="0 0 800 500" version="1.1">

  <defs>
    <linearGradient id="fanOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#74c7ec" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="800" height="500" fill="#1f2937"/>

  <!-- title block -->
  <text x="48" y="72" font-family="Roboto, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="400" fill="#ffffff">Same signal, opposite signs</text>
  <text x="48" y="106" font-family="Roboto, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="400" fill="#9ca3af">Climate risk in cotton and rubber prices</text>

  <!-- axis -->
  <line x1="48" y1="410" x2="752" y2="410" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="48" y1="160" x2="48" y2="410" stroke="#4b5563" stroke-width="1.5"/>

  <!-- forecast origin -->
  <line x1="430" y1="160" x2="430" y2="410" stroke="#e5e7eb" stroke-width="1.5"
        stroke-dasharray="5 5" opacity="0.55"/>
  <text x="436" y="176" font-family="Roboto, Helvetica, Arial, sans-serif"
        font-size="13" fill="#9ca3af">forecast origin</text>

  <!-- rubber: observed then fan, rising -->
  <path d="M430,300 L520,268 L610,236 L700,196 L752,172
           L752,272 L700,258 L610,264 L520,282 L430,300 Z"
        fill="url(#fanOuter)"/>
  <path d="M430,300 L520,278 L610,256 L700,228 L752,212
           L752,258 L700,250 L610,262 L520,284 L430,300 Z"
        fill="#74c7ec" opacity="0.34"/>
  <polyline points="48,352 110,344 172,360 234,338 296,330 358,316 430,300"
            fill="none" stroke="#74c7ec" stroke-width="2.6"/>
  <polyline points="430,300 520,280 610,258 700,232 752,216"
            fill="none" stroke="#74c7ec" stroke-width="2.6" stroke-dasharray="7 4"/>
  <text x="700" y="160" font-family="Roboto, Helvetica, Arial, sans-serif"
        font-size="15" fill="#74c7ec" text-anchor="end">rubber &#8593; +37%</text>

  <!-- cotton: observed then fan, falling -->
  <path d="M430,340 L520,352 L610,366 L700,382 L752,392
           L752,336 L700,332 L610,330 L520,332 L430,340 Z"
        fill="#fab387" opacity="0.16"/>
  <polyline points="48,318 110,330 172,322 234,336 296,330 358,336 430,340"
            fill="none" stroke="#fab387" stroke-width="2.6"/>
  <polyline points="430,340 520,344 610,350 700,358 752,364"
            fill="none" stroke="#fab387" stroke-width="2.6" stroke-dasharray="7 4"/>
  <text x="700" y="404" font-family="Roboto, Helvetica, Arial, sans-serif"
        font-size="15" fill="#fab387" text-anchor="end">cotton &#8595; &#8722;11%</text>

  <!-- ENSO driver strip -->
  <text x="48" y="452" font-family="Roboto, Helvetica, Arial, sans-serif"
        font-size="14" fill="#9ca3af">El Ni&#241;o (ONI)</text>
  <line x1="180" y1="452" x2="752" y2="452" stroke="#4b5563" stroke-width="1"/>
  <path d="M180,452 C232,452 244,428 296,428 C348,428 360,464 412,464
           C464,464 476,424 528,424 C580,424 592,458 644,458
           C696,458 708,436 752,436"
        fill="none" stroke="#cba6f7" stroke-width="2.4"/>

  <text x="48" y="486" font-family="Roboto, Helvetica, Arial, sans-serif"
        font-size="13" fill="#6b7280">The same ENSO shock is bullish for one crop and bearish for the other.</text>
</svg>
