<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300"
     viewBox="0 0 800 300" version="1.1">

  <defs>
    <linearGradient id="hdrFan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#74c7ec" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#74c7ec" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="300" fill="#1f2937"/>

  <text x="48" y="70" font-family="Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="400" fill="#ffffff">Climate signals in commodity prices</text>
  <text x="48" y="100" font-family="Roboto, Helvetica, Arial, sans-serif"
        font-size="16" fill="#9ca3af">Cotton and rubber &#183; 2001&#8211;2025 &#183; SARIMAX, VAR, alarm classifiers, Monte Carlo</text>

  <line x1="48" y1="250" x2="752" y2="250" stroke="#4b5563" stroke-width="1.5"/>
  <line x1="430" y1="140" x2="430" y2="250" stroke="#e5e7eb" stroke-width="1.5"
        stroke-dasharray="5 5" opacity="0.5"/>

  <!-- rubber fan, rising -->
  <path d="M430,196 L520,178 L610,160 L700,138 L752,126
           L752,196 L700,186 L610,190 L520,194 L430,196 Z"
        fill="url(#hdrFan)"/>
  <polyline points="48,224 110,218 172,228 234,214 296,210 358,202 430,196"
            fill="none" stroke="#74c7ec" stroke-width="2.4"/>
  <polyline points="430,196 520,186 610,174 700,160 752,152"
            fill="none" stroke="#74c7ec" stroke-width="2.4" stroke-dasharray="7 4"/>

  <!-- cotton, falling -->
  <path d="M430,216 L520,224 L610,232 L700,242 L752,248
           L752,214 L700,210 L610,208 L520,210 L430,216 Z"
        fill="#fab387" opacity="0.15"/>
  <polyline points="48,204 110,212 172,206 234,216 296,212 358,214 430,216"
            fill="none" stroke="#fab387" stroke-width="2.4"/>
  <polyline points="430,216 520,220 610,224 700,230 752,234"
            fill="none" stroke="#fab387" stroke-width="2.4" stroke-dasharray="7 4"/>

  <!-- ENSO driver -->
  <path d="M48,278 C100,278 112,262 164,262 C216,262 228,290 280,290
           C332,290 344,258 396,258 C448,258 460,286 512,286
           C564,286 576,266 628,266 C680,266 692,282 752,282"
        fill="none" stroke="#cba6f7" stroke-width="2.2" opacity="0.9"/>
</svg>
